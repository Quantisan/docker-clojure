name: Create pull request in docker-library/official-images repo

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: ["master"]

jobs:
  generate-docker-manifest:
    runs-on: ubuntu-latest
    # Only for CI runs of pushes to master, not PRs from a fork's master branch
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    outputs:
      fresh: ${{ steps.dockerfiles.outputs.fresh }}
    steps:
      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          bb: 1.12.217
      # This checks out the tip of master, which includes the Dockerfiles the
      # CI run that triggered us committed (if any).
      - name: Checkout code
        uses: actions/checkout@v6
      # The manifest points official-images at one commit, so that commit's
      # Dockerfiles have to match its config. They won't if master has moved
      # on since the CI run; in that case the CI run for the newer commit
      # regenerates them and triggers this workflow again.
      - name: Check that the Dockerfiles are up to date
        id: dockerfiles
        run: |
          bb run dockerfiles
          if [ -z "$(git status --porcelain -- target)" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfiles at $(git rev-parse --short HEAD) are out of date; skipping the official-images PR until CI regenerates them."
          fi
      - name: Generate manifest
        if: steps.dockerfiles.outputs.fresh == 'true'
        run: bb run manifest target/docker.manifest
      - name: Upload manifest artifact
        if: steps.dockerfiles.outputs.fresh == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: target/docker.manifest
          retention-days: 1
  compare-manifests:
    runs-on: ubuntu-latest
    needs: [generate-docker-manifest]
    if: needs.generate-docker-manifest.outputs.fresh == 'true'
    outputs:
      diff: ${{ steps.manifest-diff.outputs.diff }}
    steps:
      - name: Checkout docker-library/official-images repo
        uses: actions/checkout@v6
        with:
          repository: docker-library/official-images
          path: official-images
      - name: Download manifest artifact
        uses: actions/download-artifact@v8
        with:
          name: manifest
      - name: Compare manifest files
        id: manifest-diff
        # -IGitCommit: makes it ignore changes in the GitCommit: line b/c that will always be different
        run: 'echo "diff=\"$(diff -q -IGitCommit: docker.manifest official-images/library/clojure)\"" >> $GITHUB_OUTPUT'
  open-official-images-pr:
    runs-on: ubuntu-latest
    needs: [compare-manifests]
    if: contains(needs.compare-manifests.outputs.diff, 'differ')
    steps:
      - name: Download manifest artifact
        uses: actions/download-artifact@v8
        with:
          name: manifest
      - name: Checkout docker-library/official-images repo
        uses: actions/checkout@v6
        with:
          repository: docker-library/official-images
          path: official-images
      - name: Copy manifest into official-images library
        run: cp docker.manifest official-images/library/clojure
      - name: Open official-images pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.API_TOKEN_GITHUB }}
          path: official-images
          commit-message: 'Update clojure'
          committer: GitHub Actions <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: automated-clojure-update
          push-to-fork: Quantisan/official-images
          title: Update clojure
          body: |
            Automated pull request to update `library/clojure` generated by
            GitHub Actions on the Quantisan/docker-clojure repo.
